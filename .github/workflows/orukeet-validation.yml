name: Orukeet native app validation
on:
  push:
    branches: [codex/orukeet-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 40e4ade2cc3abbe95042512a864d1dedfac11f42
      - name: Record exact source and toolchain
        run: |
          mkdir -p evidence fixtures
          git rev-parse HEAD | tee evidence/source-head.txt
          xcodebuild -version | tee evidence/xcode-version.txt
          swift --version | tee evidence/swift-version.txt
          for name in en de fr silence; do
            curl --fail --retry 3 --location "https://raw.githubusercontent.com/Nathan-Roll1/muesli/${{ github.sha }}/.validation-fixtures/$name.wav" -o "fixtures/$name.wav"
          done
      - name: Complete unsigned development app with Xcode
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          MUESLI_TRUST_PACKAGE_PLUGINS=1 MUESLI_SKIP_SIGN=1 MUESLI_USE_XCODE_BUILD=1 MUESLI_ALLOW_MISSING_LOCALVQE=1 MUESLI_APP_NAME=MuesliOrukeetPreview MUESLI_BUNDLE_ID=com.muesli.orukeet-validation MUESLI_SUPPORT_DIR_NAME=MuesliOrukeetPreview MUESLI_DISPLAY_NAME=MuesliOrukeetPreview MUESLI_SPARKLE_FEED_URL='' MUESLI_INSTALL_DIR="$PWD/evidence/apps" ./scripts/build_native_app.sh debug | tee evidence/xcode-build.log
          ditto -c -k --sequesterRsrc --keepParent evidence/apps/MuesliOrukeetPreview.app evidence/MuesliOrukeetPreview.zip
          rm -rf evidence/apps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Muesli-orukeet-validation
          path: evidence/
          retention-days: 14
