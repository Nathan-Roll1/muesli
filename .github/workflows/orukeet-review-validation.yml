name: Orukeet review fixes native validation
on:
  push:
    branches: [codex/orukeet-validation]
    paths: [.github/workflows/orukeet-review-validation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fc8b02a9c58d4e6ec9134d315e79a6e0bc33293f
      - name: Record exact source and prepare attributed fixtures
        run: |
          mkdir -p evidence fixtures
          git rev-parse HEAD | tee evidence/source-head.txt
          xcodebuild -version | tee evidence/xcode-version.txt
          swift --version | tee evidence/swift-version.txt
          for name in en de fr silence; do
            curl --fail --retry 3 --location "https://raw.githubusercontent.com/Nathan-Roll1/muesli/5f03f1e605d83b86d123a59fa2363fea63687b3c/.validation-fixtures/$name.wav" -o "fixtures/$name.wav"
          done
      - name: Focused regressions and actual model runtime
        run: |
          set -o pipefail
          ORUKEET_AUDIO_DIR="$PWD/fixtures" swift test --package-path native/MuesliNative --filter 'OrukeetModelStoreTests|FluidAudioTranscriberTests|BackendOptionTests|ModelDownloadCoordinatorTests|DictationBackendPreparationTests' 2>&1 | tee evidence/swift-tests.log
      - name: New process with all network access denied
        run: |
          set -o pipefail
          ORUKEET_AUDIO_DIR="$PWD/fixtures" sandbox-exec -p '(version 1)(allow default)(deny network*)' swift test --disable-sandbox --skip-build --package-path native/MuesliNative --filter 'OrukeetModelStoreTests.runtimeSmoke' 2>&1 | tee evidence/offline-runtime.log
      - name: Complete unsigned development app with Xcode
        run: |
          set -o pipefail
          brew install xcodegen
          MUESLI_TRUST_PACKAGE_PLUGINS=1 MUESLI_SKIP_SIGN=1 MUESLI_USE_XCODE_BUILD=1 MUESLI_ALLOW_MISSING_LOCALVQE=1 MUESLI_APP_NAME=MuesliOrukeetPreview MUESLI_BUNDLE_ID=com.muesli.orukeet-validation MUESLI_SUPPORT_DIR_NAME=MuesliOrukeetPreview MUESLI_DISPLAY_NAME=MuesliOrukeetPreview MUESLI_SPARKLE_FEED_URL='' MUESLI_INSTALL_DIR="$PWD/evidence/apps" ./scripts/build_native_app.sh debug 2>&1 | tee evidence/xcode-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Muesli-orukeet-review-validation
          path: |
            evidence/*.txt
            evidence/*.log
          retention-days: 14
